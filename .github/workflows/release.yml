name: Release

# Publishes redb to crates.io via Trusted Publishing (OIDC) on a `v*` tag push, after approval in
# the `crates-io` environment. No crates.io token is stored anywhere: the job exchanges its OIDC
# token for one that expires after 30 minutes and is revoked when the job ends.
# redb-derive is released from `derive-v*` tags by release-derive.yml, and redb-python from
# `python-v*` tags by wheels.yml
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Kept minimal and pinned to commit SHAs: this is the only job that can request an OIDC token,
  # and the `crates-io` environment requires a maintainer's approval before it runs.
  publish:
    name: Publish redb to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/redb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check tag matches redb version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "redb") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish
        run: cargo publish --package redb
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
