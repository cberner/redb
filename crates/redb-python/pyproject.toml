[project]
name = "redb"
description = "Python bindings for redb, an embedded key-value store"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
dynamic = ["version"]
classifiers = ["Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.maturin]
compatibility = "manylinux2014"
# The package's `__init__.py` wraps the extension module
python-source = "python"
module-name = "redb.redb"
# Left in the source by running the tests
exclude = ["python/**/__pycache__/**"]

[tool.uv]
# Rebuild the extension when its sources or build profile change. The redb crate is outside this
# directory, where uv does not look, so `just install_py` rebuilds unconditionally; cargo then
# recompiles only what changed.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "build.rs" },
    { file = "src/**/*.rs" },
    { env = "MATURIN_PEP517_ARGS" },
]

[tool.pytest.ini_options]
testpaths = ["test"]
