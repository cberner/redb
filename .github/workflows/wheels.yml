name: Wheels

# Builds and tests the Python wheels and sdist. On a `python-v*` tag push, the `publish` job uploads
# them to PyPI via Trusted Publishing (OIDC), after approval in the `pypi` environment.
# No PyPI token is stored anywhere; only the `publish` job can request an OIDC token.
on:
  push:
    tags:
      - "python-v*"
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - ".github/check_py_dist.sh"
      - "crates/redb-python/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path crates/redb-python/Cargo.toml

      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist redb
          python -m pip install pytest hypothesis
          python -m pytest crates/redb-python/test

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/redb-python/Cargo.toml

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Bundle release artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Check release files
        run: .github/check_py_dist.sh dist

      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  # Kept minimal and pinned to commit SHAs: this is the only job that can request an OIDC token,
  # and the `pypi` environment requires a maintainer's approval before it runs.
  publish:
    name: Publish to PyPI
    needs: [bundle]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/redb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-dist
          path: dist

      - name: Check tag matches redb-python version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/redb-python/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "python-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crates/redb-python/Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Check release files
        run: .github/check_py_dist.sh dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
